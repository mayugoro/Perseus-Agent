<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perseus</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">☤ PERSEUS</div>
    <button id="newBtn" class="btn">+ New session</button>
    <div class="side-title">Sessions</div>
    <div id="sessions"></div>
  </aside>
  <main>
    <header>
      <div id="model">…</div>
      <div id="status" class="muted"></div>
      <div class="spacer"></div>
      <button id="stopBtn" class="btn danger">Stop</button>
    </header>
    <section id="chat"></section>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message Perseus…  (Enter send, Shift+Enter newline)"></textarea>
      <button class="btn send" type="submit">➤</button>
    </form>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
